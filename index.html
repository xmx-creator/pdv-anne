<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anne Patisserie</title>
<meta name="theme-color" content="#8B2A24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anne Patisserie">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Paleta da loja (creme e vinho do cartão da Anne). Layout: app de balcão, 4 abas, números grandes, cor só onde há decisão. */
:root{
  --bg:#FAF1DC; --card:#FFFBF2; --ink:#2B1A17; --mute:#75605A; --line:#E6D6B8; --chip:#F1E3C6;
  --acc:#8B2A24; --acc-ink:#FFF6EA; --ok:#2C7A49; --warn:#A5640B; --bad:#B3261E; --ok-bg:#E1F0E4; --warn-bg:#F7E8C8; --bad-bg:#F7DAD6;
  --fd:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --fb:"DM Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1210; --card:#261A17; --ink:#F4E8DA; --mute:#B8A396; --line:#3B2A25; --chip:#33231F;
  --acc:#E58277; --acc-ink:#2A1210; --ok:#74D19A; --warn:#E7B85F; --bad:#F59A90; --ok-bg:#1E3626; --warn-bg:#3A2E15; --bad-bg:#40201C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1210; --card:#261A17; --ink:#F4E8DA; --mute:#B8A396; --line:#3B2A25; --chip:#33231F;
  --acc:#E58277; --acc-ink:#2A1210; --ok:#74D19A; --warn:#E7B85F; --bad:#F59A90; --ok-bg:#1E3626; --warn-bg:#3A2E15; --bad-bg:#40201C; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:-.01em;text-wrap:balance}
.topo{max-width:960px;margin:0 auto;padding:18px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topo h1{font-size:26px;font-weight:800;color:var(--acc)}
.topo small{display:block;color:var(--mute);font-size:13px}
.modo{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--chip);color:var(--mute)}
.modo.nuvem{background:var(--ok-bg);color:var(--ok)}.modo.local{background:var(--ok-bg);color:var(--ok)}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h2{font-size:18px;font-weight:600;margin-bottom:8px}
.card h3{font-size:15px;font-weight:600;margin:0 0 6px}
.nota{color:var(--mute);font-size:13px;margin:6px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.kpi{background:var(--chip);border-radius:12px;padding:10px 12px;min-width:0}
.kpi small{display:block;color:var(--mute);font-size:12px}
.kpi b{font-family:var(--fd);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.alert{border-radius:12px;padding:10px 12px;font-size:14px;background:var(--warn-bg);color:var(--warn)}
.alert.bom{background:var(--ok-bg);color:var(--ok)}.alert.ruim{background:var(--bad-bg);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.pills,.chips{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.pill,.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;min-height:40px}
.chip{padding:5px 12px;min-height:34px;font-size:13px;background:var(--chip);border-color:transparent}
.pill[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn{border:0;background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:10px 16px;font-weight:700;min-height:42px}
.btn.sec{background:var(--chip);color:var(--ink);font-weight:500}
.btn.perigo{background:var(--bad);color:#fff}
.btn.peq{padding:6px 10px;min-height:34px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--acc)}
textarea{min-height:60px;resize:vertical}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.prods{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.prod{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.prod b{font-weight:500;font-size:14px;overflow-wrap:anywhere}
.prod span{font-family:var(--fd);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.prod i{position:absolute;top:8px;right:8px;min-width:22px;height:22px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.prod:active{transform:scale(.98)}
.linha{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line)}
.linha:first-child{border-top:0}
.linha .nm{font-weight:500;overflow-wrap:anywhere}.linha .nm small{display:block;color:var(--mute);font-weight:400}
.linha .tot{font-family:var(--fd);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ctl{display:flex;gap:6px;align-items:center;grid-column:1/-1;flex-wrap:wrap}
.ctl select{width:auto;min-height:36px;padding:4px 8px}
.step{display:flex;align-items:center;gap:2px}
.step button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.step span{min-width:30px;text-align:center;font-weight:700}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--mute);font-weight:500;font-size:12px}
td.n,th.n{text-align:right}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar.ok i{background:var(--ok)}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr .a{font-weight:500;overflow-wrap:anywhere;text-align:left;background:none;border:0;padding:0}
.pr .b{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
.pr .c{grid-column:1/-1;display:flex;gap:10px;align-items:center;color:var(--mute);font-size:13px}
.pr .c .bar{flex:1}
.tag{display:inline-block;font-size:11px;border-radius:99px;padding:2px 8px;background:var(--warn-bg);color:var(--warn);margin-left:6px;font-weight:500}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.painel{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.abas{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:20}
.abas div{display:flex;gap:4px;width:100%;max-width:960px}
.abas button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;min-height:48px;font-weight:500;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.abas button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.abas button[aria-selected="true"]{color:var(--acc);background:var(--chip);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
svg.gr{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
@media (prefers-reduced-motion:no-preference){.prod,.btn{transition:transform .08s}}
</style>
</head>
<body>

<header class="topo">
  <div><h1>Anne Patisserie</h1><small>Café e Empório · gestão da loja</small></div>
  <span class="modo" id="modo">carregando…</span>
</header>
<main class="wrap" id="app"></main>
<nav class="abas" aria-label="Seções"><div id="abas"></div></nav>
<div id="toast" hidden></div>

<script>
(function () {
'use strict';
var $ = function (s, r) { return (r || document).querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ var n = parseFloat(String(v == null ? '' : v).trim().replace(',', '.')); return isFinite(n) ? n : 0; }
function brl(n){ return (isFinite(n) ? n : 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
function brl0(n){ return (isFinite(n) ? n : 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0}); }
function pc(n, d){ d = d || 0; return (isFinite(n) ? n : 0).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d}) + '%'; }
function iso(d){ return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function hoje(){ return iso(new Date()); }
function dBR(s){ return s.split('-').reverse().join('/'); }
function uid(){ return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(new RegExp('[\u0300-\u036f]', 'g'), ''); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function arred05(n){ return Math.ceil(+(n * 2).toFixed(6)) / 2; }

var PAGS = [['pix','Pix'],['din','Dinheiro'],['deb','Débito'],['cre','Crédito']];
var CATS = ['Cafeteria','Confeitaria','Bebidas','Empório'];
var COLS = ['produtos','vendas','config','historico'];
var CONFIG0 = { fixos:[], proLabore:0, diasOperacao:30, taxas:{pix:0, din:0, deb:1.5, cre:1.5}, margemRef:35, tetoMei:81000 };

var S = { produtos:{}, vendas:{}, config:{}, historico:{}, carregou:{}, aba:'hoje', dia:hoje(), mes:hoje().slice(0, 7),
          pag:'pix', cat:'Todos', busca:'', pCat:'Todos', pBusca:'', ed:null, modo:'carregando' };

/* ---------- aviso ---------- */
var toastT;
function avisar(msg){ var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 3500); }

/* ---------- armazenamento: nuvem (db) ou, sem ela, o navegador ---------- */
var Store = {
  db: null, pend: {}, busy: {}, tm: {}, loc: null,
  init: function () {
    var self = this;
    var p = (window.claude && window.claude.use) ? window.claude.use('db') : Promise.resolve(null);
    return Promise.resolve(p).catch(function(){ return null; }).then(function (db) {
      if (db) {
        self.db = db; S.modo = 'nuvem';
        COLS.forEach(function (col) {
          db.collection(col).onSnapshot(function (snap) {
            var o = {};
            snap.docs.forEach(function (d) { if (!self.pendente(col + '/' + d.id)) o[d.id] = clone(d.data()); else o[d.id] = S[col][d.id]; });
            Object.keys(S[col]).forEach(function (id) { if (self.pendente(col + '/' + id) && !(id in o)) o[id] = S[col][id]; });
            S[col] = o; S.carregou[col] = true; agendaRender();
          }, function (e) { S.carregou[col] = true; avisar('Não consegui ler os dados (' + ((e && e.code) || 'erro') + ').'); agendaRender(); });
        });
      } else {
        S.modo = 'local';
        try { self.loc = JSON.parse(localStorage.getItem('anne_nuvem_local') || '{}'); } catch (e) { self.loc = {}; }
        COLS.forEach(function (c) { S[c] = self.loc[c] || {}; S.carregou[c] = true; });
        agendaRender();
      }
    });
  },
  pendente: function (path) { return (path in this.pend) || !!this.busy[path]; },
  salvar: function (path, data) {
    var self = this; this.pend[path] = data;
    clearTimeout(this.tm[path]); this.tm[path] = setTimeout(function () { self.enviar(path); }, 350);
  },
  enviar: function (path) {
    var self = this;
    if (this.busy[path]) { this.tm[path] = setTimeout(function () { self.enviar(path); }, 200); return; }
    if (!(path in this.pend)) return;
    var data = this.pend[path]; delete this.pend[path]; this.busy[path] = true;
    var parts = path.split('/'), col = parts[0], id = parts[1], job;
    if (this.db) { var ref = this.db.doc(path); job = data === null ? ref.delete() : ref.set(data); }
    else { this.loc[col] = this.loc[col] || {}; if (data === null) delete this.loc[col][id]; else this.loc[col][id] = data;
      try { localStorage.setItem('anne_nuvem_local', JSON.stringify(this.loc)); } catch (e) {} job = Promise.resolve(); }
    job.catch(function (e) { avisar(e && e.code === 'invalid_argument' ? 'Sem permissão para salvar (só leitura).' : 'Não consegui salvar. Tente de novo.'); })
       .then(function () { self.busy[path] = false; if (path in self.pend) self.tm[path] = setTimeout(function () { self.enviar(path); }, 50); });
  }
};

/* ---------- contas ---------- */
function cfg(){
  var g = S.config.geral || {}, c = {};
  c.fixos = Array.isArray(g.fixos) ? g.fixos : CONFIG0.fixos;
  c.proLabore = g.proLabore != null ? g.proLabore : CONFIG0.proLabore;
  c.diasOperacao = g.diasOperacao != null ? g.diasOperacao : CONFIG0.diasOperacao;
  c.taxas = Object.assign({}, CONFIG0.taxas, g.taxas || {});
  c.margemRef = g.margemRef != null ? g.margemRef : CONFIG0.margemRef;
  c.tetoMei = g.tetoMei != null ? g.tetoMei : CONFIG0.tetoMei;
  return c;
}
function salvaCfg(c){ S.config.geral = c; Store.salvar('config/geral', c); }
function taxaDe(pag){ return num(cfg().taxas[pag]) / 100; }
function totFixos(){ return cfg().fixos.reduce(function (t, f) { return t + num(f.valor); }, 0); }
function linhaT(l){ var r = num(l.qtd) * num(l.preco), k = num(l.qtd) * num(l.custo); return { rec:r, cus:k, tax:r * taxaDe(l.pag) }; }
function totDia(doc){
  var T = { rec:0, cus:0, tax:0, itens:0 };
  (doc.linhas || []).forEach(function (l) { var t = linhaT(l); T.rec += t.rec; T.cus += t.cus; T.tax += t.tax; T.itens += num(l.qtd); });
  return T;
}
function totaisMes(mes){
  var T = { rec:0, cus:0, tax:0, recReal:0, diasVenda:0, porDia:[], porCat:{}, porProd:{} };
  var p = mes.split('-'), nd = new Date(+p[0], +p[1], 0).getDate();
  for (var i = 1; i <= nd; i++) {
    var ds = mes + '-' + String(i).padStart(2, '0'), doc = S.vendas[ds], rec = 0, folga = !!(doc && doc.folga);
    if (doc && !folga) (doc.linhas || []).forEach(function (l) {
      var t = linhaT(l); rec += t.rec; T.rec += t.rec; T.cus += t.cus; T.tax += t.tax; if (!l.est) T.recReal += t.rec;
      var cat = l.cat || 'Outros', c = T.porCat[cat] = T.porCat[cat] || { rec:0, cus:0, tax:0 };
      c.rec += t.rec; c.cus += t.cus; c.tax += t.tax;
      var pr = T.porProd[l.nome] = T.porProd[l.nome] || { qtd:0, rec:0, lucro:0 };
      pr.qtd += num(l.qtd); pr.rec += t.rec; pr.lucro += t.rec - t.cus - t.tax;
    });
    T.porDia.push({ n:i, ds:ds, v:rec, folga:folga }); if (rec > 0) T.diasVenda++;
  }
  return T;
}
function prodLista(){
  return Object.keys(S.produtos).map(function (id) { var p = Object.assign({ id:id }, S.produtos[id]); return p; })
    .sort(function (a, b) { var ia = CATS.indexOf(a.cat), ib = CATS.indexOf(b.cat); ia = ia < 0 ? 99 : ia; ib = ib < 0 ? 99 : ib; return ia - ib || norm(a.nome).localeCompare(norm(b.nome)); });
}
function margemP(p){ return num(p.preco) > 0 ? (num(p.preco) - num(p.custo)) / num(p.preco) : 0; }

/* ---------- gráficos (SVG, cores do tema) ---------- */
function T_(x, y, s, a, c, fs){ return '<text x="' + x + '" y="' + y + '" text-anchor="' + (a || 'middle') + '" style="fill:' + (c || 'var(--mute)') + ';font-size:' + (fs || 12) + 'px;font-family:var(--fb)">' + s + '</text>'; }
function svgDias(dias, zzDia, plDia){
  var W = 480, H = 230, pl = 46, pr = 8, pt = 18, pb = 24, nd = dias.length;
  var mx = Math.max(1, Math.max.apply(null, dias.map(function (d) { return d.v; })), plDia * 1.08, zzDia * 1.08);
  function y(v){ return pt + (H - pt - pb) * (1 - v / mx); }
  var bw = (W - pl - pr) / nd, s = '<svg class="gr" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Faturamento por dia">';
  [0, .5, 1].forEach(function (f) { var v = mx * f; s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '" style="stroke:var(--line)"/>' + T_(pl - 6, y(v) + 3, brl0(v), 'end'); });
  dias.forEach(function (d, i) {
    var x = pl + i * bw;
    if (d.v > 0) { var cor = (plDia > 0 && d.v >= plDia) ? 'var(--ok)' : (zzDia > 0 && d.v >= zzDia) ? 'var(--acc)' : 'var(--bad)';
      s += '<rect x="' + (x + 1.5) + '" y="' + y(d.v) + '" width="' + Math.max(1, bw - 3) + '" height="' + (H - pb - y(d.v)) + '" rx="2" style="fill:' + cor + '"><title>' + dBR(d.ds) + ': ' + brl(d.v) + '</title></rect>'; }
    if (d.folga) s += T_(x + bw / 2, H - pb - 4, 'F');
    if (nd <= 16 || i % 2 === 0) s += T_(x + bw / 2, H - 9, d.n);
  });
  if (zzDia > 0) s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(zzDia) + '" y2="' + y(zzDia) + '" stroke-dasharray="5 4" style="stroke:var(--warn);stroke-width:1.5"/>' + T_(W - pr, y(zzDia) - 4, 'contas ' + brl0(zzDia), 'end', 'var(--warn)');
  if (plDia > 0) s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(plDia) + '" y2="' + y(plDia) + '" stroke-dasharray="5 4" style="stroke:var(--ok);stroke-width:1.5"/>' + T_(W - pr, y(plDia) - 4, '+ pró-labore ' + brl0(plDia), 'end', 'var(--ok)');
  return s + '</svg>';
}

/* ---------- telas ---------- */
function chipsCat(atual, acao){
  return '<div class="chips">' + ['Todos'].concat(CATS).map(function (c) { return '<button class="chip" data-act="' + acao + '" data-v="' + esc(c) + '" aria-pressed="' + (atual === c) + '">' + esc(c) + '</button>'; }).join('') + '</div>';
}
function vHoje(){
  var d = S.dia, doc = S.vendas[d] || { linhas:[], folga:false, obs:'' }, T = totDia(doc), lista = prodLista();
  var q = {}; (doc.linhas || []).forEach(function (l) { q[l.pid] = (q[l.pid] || 0) + num(l.qtd); });
  var b = norm(S.busca);
  var vis = lista.filter(function (p) { return p.ativo !== false && (S.cat === 'Todos' || p.cat === S.cat) && (!b || norm(p.nome).indexOf(b) >= 0); });
  var sobra = T.rec - T.cus - T.tax, h = '';

    el.textContent = (c > 0 && r > 0 && r <= c) ? 'Taxa: ' + brl(c - r) + ' (' + pc((c - r) / c * 100, 2) + ')' + (c < 20 ? '. Valor pequeno: os centavos arredondam, teste com uma venda maior.' : '.') : 'Preencha os dois valores. Use uma venda acima de R$ 30 para o resultado ser preciso.'; return; }
  if (t.dataset.f === 'obs') { var d = docDia(); d.obs = t.value; gravaDia(); }
});
function guardaConta(t){
  var c = cfg(), k = t.dataset.k;
  if (t.dataset.c === 'taxa') c.taxas[k] = num(t.value);
  else if (t.dataset.c === 'geral') c[k] = num(t.value);
  else { var f = c.fixos[+t.dataset.i]; if (f) f[k] = k === 'valor' ? num(t.value) : t.value; var el = document.getElementById('totfx'); if (el) el.textContent = brl(c.fixos.reduce(function (s, x) { return s + num(x.valor); }, 0)); }
  salvaCfg(c);
}
document.addEventListener('change', function (ev) {
  var t = ev.target, f = t.dataset.f;
  if (f === 'restaura') { restaura(t.files && t.files[0]); t.value = ''; }
  else if (f === 'dia' && t.value) { S.dia = t.value; render(); }
  else if (f === 'mes' && t.value) { S.mes = t.value; render(); }
  else if (f === 'folga') { var d = docDia(); d.folga = t.checked; gravaDia(); render(); }
  else if (f === 'pagLinha') { var doc = docDia(), l = doc.linhas.filter(function (x) { return x.id === t.dataset.id; })[0]; if (l) { l.pag = t.value; gravaDia(); render(); } }
  else if (f === 'prSel') { prAbre(t.value); }
  else if (t.dataset.pr === 'cat') { lerPr(); S.pr.fator = S.pr.cat === 'Empório' ? '1,5' : '2,2'; render(); }
  else if (t.dataset.e === 'custoReal' || t.dataset.e === 'ativo') { lerEd(); }
});

render();
Store.init();
// Grava na hora o que ainda estava esperando o atraso, quando o app sai da tela.
function guardaTudo(){ Object.keys(Store.pend).forEach(function (p) { clearTimeout(Store.tm[p]); Store.enviar(p); }); }
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') guardaTudo(); });
window.addEventListener('pagehide', guardaTudo);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
